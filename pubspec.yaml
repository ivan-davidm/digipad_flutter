name: digipad_flutter
description: 'DigiTower 3D Premium - Professional optical measurement and simulation app'
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 4.0.0+27

environment:
  sdk: '>=3.8.1 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: 1.0.8

  # AR and Camera functionality
  permission_handler: 12.0.1
  tflite_flutter: 0.12.1
  camera: 0.11.2+1
  image: 4.7.2

  # File handling and storage
  path: ^1.9.1
  path_provider: 2.1.5
  sembast: 3.8.5+1

  # State Management
  bloc: 9.1.0
  flutter_bloc: 9.1.1

  # Networking
  http: 1.6.0
  nearby_connections: ^4.3.0
  shared_preferences: ^2.5.3

  # Location services
  geolocator: 14.0.2

  # Device info
  device_info_plus: 10.1.1

  # SVG support
  flutter_svg: 2.2.3
  flutter_cache_manager: 3.4.1
  cached_network_image: 3.4.1
  exif: 3.3.0
  image_picker: 1.2.1
  screenshot: 3.0.0
  widget_zoom: 0.0.4
  provider: 6.1.5+1
  intl: 0.20.2
  share_plus: ^12.0.1

  # UI
  auto_size_text: ^3.0.0
  # Splash screen generator
  flutter_native_splash: 2.4.7
  video_player: ^2.10.1
  video_thumbnail: ^0.5.6
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0
  widgets_to_image: ^2.0.1

  # Photo Sync feature
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  sensors_plus: ^7.0.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  fake_cloud_firestore: ^4.0.0

  # App icon generator
  flutter_launcher_icons: 0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/scenes/
    - assets/images/visual_health/
    - assets/images/cosmetic_lenses/acuvue/
    - assets/images/cosmetic_lenses/devlyn/
    - assets/images/cosmetic_lenses/durasoft/
    - assets/images/cosmetic_lenses/fresh_look/
    - assets/images/cosmetic_lenses/normal/
    - assets/images/cosmetic_lenses/optima/
    - assets/images/cosmetic_lenses/star_colors/
    - assets/images/cosmetic_lenses/tricolor/
    - assets/images/simulations/
    - assets/images/simulations/anti_reflex/
    - assets/images/simulations/bifocal/
    - assets/images/simulations/drive/
    - assets/images/simulations/myopia/
    - assets/images/simulations/multifocal/
    - assets/images/simulations/photochromic/
    - assets/images/simulations/polarized/
    - assets/images/simulations/presbicia/
    - assets/images/simulations/blue_filter/
    - assets/images/simulations/aspheric/
    - assets/images/simulations/drivewear/
    - assets/images/simulations/solar/
    - assets/images/simulations/tint/
    - assets/images/lenses_3d/
    - assets/images/
    - assets/svgs/

# Flutter Native Splash Configuration
flutter_native_splash:
  color: '#000000'
  image: assets/images/splash_image.png
  color_dark: '#000000'
  image_dark: assets/images/splash_image.png

  # Ensure proper scaling for landscape mode
  fullscreen: true

  # Android specific settings
  android_gravity: center
  android_12:
    image: assets/images/splash_image.png
    color: '#000000'
    image_dark: assets/images/splash_image.png
    color_dark: '#000000'

  # iOS specific settings - fill width completely
  ios_content_mode: scaleAspectFill

  web: false

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/images/ic_launcher.png'
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false
  linux:
    generate: false
